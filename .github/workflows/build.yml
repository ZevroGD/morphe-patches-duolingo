
name: Build and Release Morphe Patches

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Configure Gradle credentials
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_KEY: ${{ secrets.GPR_KEY }}
        run: |
          mkdir -p "$HOME/.gradle"
          printf 'gpr.user=%s\ngpr.key=%s\n' \
            "$GPR_USER" "$GPR_KEY" \
            >> "$HOME/.gradle/gradle.properties"

      - name: Install dependencies
        run: npm ci

      - name: Build and publish release
        id: release
        uses: cycjimmy/semantic-release-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MORPHE_SIGNING_KEY: ${{ secrets.MORPHE_SIGNING_KEY }}

      - name: Verify build when no release is published
        if: steps.release.outputs.new_release_published != 'true'
        run: ./gradlew :patches:buildAndroid clean --no-daemon --no-configuration-cache

      - name: Attest release
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: Morphe Patches
          subject-path: patches/build/libs/patches-*.mpp

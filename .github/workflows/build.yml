name: Build and Release Morphe Patches

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 1.0.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: read

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must be semantic, for example 1.0.0"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi

      - name: Ensure release runs from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run releases from the main branch"
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Configure Gradle credentials
        env:
          GPR_USER: ${{ secrets.GPR_USER || github.actor }}
          GPR_KEY: ${{ secrets.GPR_KEY || github.token }}
        run: |
          mkdir -p "$HOME/.gradle"
          printf 'gpr.user=%s\ngpr.key=%s\n' "$GPR_USER" "$GPR_KEY" >> "$HOME/.gradle/gradle.properties"

      - name: Build patches
        env:
          VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew -Pversion="$VERSION" :patches:buildAndroid --no-daemon --no-configuration-cache

      - name: Verify bundle
        id: bundle
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          shopt -s nullglob
          files=(patches/build/libs/*.mpp)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .mpp file, found ${#files[@]}"
            printf '%s\n' "${files[@]}"
            exit 1
          fi
          python3 - "${files[0]}" "$VERSION" <<'PY'
          import sys
          import zipfile

          bundle, version = sys.argv[1:]
          # The old DuolingoLinearProgressBarPatch.kt file was replaced by
          # DuolingoProgressBarPatches.kt, which now defines three top-level patches.
          expected_symbols = [
              b"app/template/patches/duolingo/DuolingoProgressBarPatchesKt",
              b"getDuolingoLinearProgressMappingPatch",
              b"getDuolingoConstantSpeedProgressPatch",
              b"getDuolingoDisableRiveProgressBarPatch",
              b"app/template/patches/duolingo/DuolingoLeaguesPatchesKt",
              b"getDuolingoRemoveLeaguesPatch",
              b"getDuolingoBlockLeaguesNotificationsPatch",
              b"app/template/patches/duolingo/DuolingoVideoCallPatchesKt",
              b"getDuolingoRemoveVideoCallPatch",
              b"getDuolingoRemoveVideoCallPathNodesPatch",
              b"app/template/patches/duolingo/DuolingoQuestPatchesKt",
              b"getDuolingoHideVideoCallQuestsPatch",
          ]

          with zipfile.ZipFile(bundle) as archive:
              names = set(archive.namelist())
              if "classes.dex" not in names:
                  raise SystemExit("::error::Bundle is missing classes.dex")
              if "META-INF/MANIFEST.MF" not in names:
                  raise SystemExit("::error::Bundle is missing META-INF/MANIFEST.MF")

              manifest = archive.read("META-INF/MANIFEST.MF").decode("utf-8", "replace")
              if f"Version: {version}" not in manifest:
                  raise SystemExit("::error::Bundle manifest version does not match requested release")
              if "Patcher-Version:" not in manifest:
                  raise SystemExit("::error::Bundle manifest is missing Patcher-Version")

              dex = archive.read("classes.dex")
              missing = [symbol.decode("ascii") for symbol in expected_symbols if symbol not in dex]
              if missing:
                  raise SystemExit(
                      "::error::Expected progress patch symbols were not found in classes.dex: "
                      + ", ".join(missing)
                  )

          print(f"Bundle structure OK: {bundle}")
          PY

          echo "file=${files[0]}" >> "$GITHUB_OUTPUT"
          echo "asset=patches-$VERSION.mpp" >> "$GITHUB_OUTPUT"

      - name: Test bundle with Morphe JVM patch loader
        run: ./gradlew :patches:test --no-daemon --no-configuration-cache --stacktrace

      - name: Upload Gradle test diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: morphe-release-test-diagnostics
          path: |
            patches/build/reports/tests/test/
            patches/build/test-results/test/
          if-no-files-found: warn
          retention-days: 7

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" "${{ steps.bundle.outputs.file }}#patches-$VERSION.mpp" \
            --target "$GITHUB_SHA" \
            --title "Zevro Patches v$VERSION" \
            --generate-notes

      - name: Update Morphe source metadata
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import datetime, json, os
          version = os.environ["VERSION"]
          path = "patches-bundle.json"
          data = {
              "created_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%S"),
              "description": "Custom Morphe patches for Duolingo by Zevro.",
              "download_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/v{version}/patches-{version}.mpp",
              "signature_download_url": "",
              "version": version,
          }
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          catalog_path = "patches-list.json"
          with open(catalog_path, encoding="utf-8") as f:
              catalog = json.load(f)
          catalog["version"] = version
          with open(catalog_path, "w", encoding="utf-8") as f:
              json.dump(catalog, f, indent=2)
              f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches-bundle.json patches-list.json
          git commit -m "chore: update Morphe source metadata for v$VERSION"
          git push origin HEAD:main
